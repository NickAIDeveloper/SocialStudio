# Runs the test suite on every push and pull request.
#
# Until now the only workflow in this repo was brain-daily.yml — nothing ran
# `npm test` automatically, so every test here was advisory: it only executed if
# a human remembered to run it locally before pushing. That is how the silent
# cron 405 reached production twice despite a regression test existing
# specifically to catch it (src/__tests__/middleware-cron-routes.test.ts).
#
# Deliberately fast (install + test + lint, no build) so it stays under a minute
# and nobody is tempted to skip it. Vercel already builds on push, so a build
# step here would duplicate that gate rather than add one.

name: CI

on:
  push:
    branches: ['**']
  pull_request:

# A new push to the same branch makes the previous run irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # `npm install`, not `npm ci`. The committed package-lock.json is out of
      # sync with package.json (missing @emnapi/* transitive deps), which CI
      # caught on its first ever run — nothing had clean-installed this repo
      # before. The obvious fix, regenerating the lockfile, cannot be done on
      # the Windows dev machine: npm prunes other platforms' optional binaries,
      # so a regenerated lockfile loses @esbuild/linux-x64 and breaks this
      # runner instead. Regenerating it needs a Linux environment.
      #
      # Until then `npm install` resolves the tree on the runner and platform
      # binaries land correctly. Slower and not byte-reproducible, but the point
      # of this workflow is that tests RUN — a reproducibility guarantee that
      # blocks every test from executing is worth strictly less than nothing.
      - name: Install
        run: npm install --no-audit --no-fund

      - name: Test
        run: npm test

      # Now a real gate: the 13 pre-existing errors were cleared on 2026-08-04,
      # so this starts green and any new error is genuinely new. Warnings (92 of
      # them, mostly unused vars) are still permitted — turning those into
      # failures today would just reintroduce the red-from-birth problem.
      - name: Lint
        run: npm run lint
