# Runs the test suite on every push and pull request.
#
# Until now the only workflow in this repo was brain-daily.yml — nothing ran
# `npm test` automatically, so every test here was advisory: it only executed if
# a human remembered to run it locally before pushing. That is how the silent
# cron 405 reached production twice despite a regression test existing
# specifically to catch it (src/__tests__/middleware-cron-routes.test.ts).
#
# Deliberately fast (install + test + lint, no build) so it stays under a minute
# and nobody is tempted to skip it. Vercel already builds on push, so a build
# step here would duplicate that gate rather than add one.

name: CI

on:
  push:
    branches: ['**']
  pull_request:

# A new push to the same branch makes the previous run irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Back to `npm ci` now the lockfile is in sync (regenerated on Linux via
      # lockfile-refresh.yml, 2026-08-04). Reproducible and faster.
      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      # Now a real gate: the 13 pre-existing errors were cleared on 2026-08-04,
      # so this starts green and any new error is genuinely new. Warnings (92 of
      # them, mostly unused vars) are still permitted — turning those into
      # failures today would just reintroduce the red-from-birth problem.
      - name: Lint
        run: npm run lint
