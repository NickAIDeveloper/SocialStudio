name: Daily Brain Run
on:
  schedule:
    - cron: '0 3 * * *'   # 03:00 UTC daily
  workflow_dispatch:
    inputs:
      force_autopilot:
        description: 'Bypass autopilot isDueNow check (for manual testing)'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run brain pipeline
        env:
          BRAIN_CRON_SECRET: ${{ secrets.BRAIN_CRON_SECRET }}
          BRAIN_BASE_URL: https://goviraleza.com
          FORCE_AUTOPILOT: ${{ inputs.force_autopilot || 'false' }}
        run: node scripts/brain/run-daily.mjs
